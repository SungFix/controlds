name: Refine simple login UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-simple-login.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link refined login stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="login-simple-v2.css?v=1">'
          if link not in s:
              needle = '<link rel="shortcut icon" href="favicon.svg?v=1">'
              assert needle in s
              s = s.replace(needle, needle + '\n' + link, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          grep -q 'login-simple-v2.css?v=1' index.html
          test -f login-simple-v2.css

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use simple refined login interface"
          git push origin HEAD:main
