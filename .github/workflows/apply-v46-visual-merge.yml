name: Apply V46 visual merge
on:
  push:
    branches: [v46-visual-merge-chatgpt]
permissions:
  contents: write
jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize V46 frontend runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const today=recifeDateKey();','let today=recifeDateKey();',1)
          s=re.sub(r'function loadStudents\(\)\{.*?\n\}\nlet students=loadStudents\(\);','function loadStudents(){ return DEFAULT_STUDENTS; }\nlet students=loadStudents();',s,count=1,flags=re.S)
          s=re.sub(r'^.*localStorage\.setItem\(.*\);.*\n','',s,flags=re.M)
          s=re.sub(r'function loadLocalSharedState\(\)\{.*?\n\}\nfunction persistLocalShared\(\)\{.*?\n\}\nfunction scheduleSharedPersist\(\)\{.*?\n\}','function loadLocalSharedState(){ return normalizeSharedState({requests:[],history:[],students:[],permissions:[]}); }\nfunction persistLocalShared(){ return; }\nfunction scheduleSharedPersist(){ return; }',s,count=1,flags=re.S)
          s=re.sub(r'async function pushRemoteState\(\)\{.*?\nfunction setSyncState\(state\)\{','async function pushRemoteState(){ return false; }\nasync function loadRemoteShared(){ return; }\nfunction subscribeRemote(){ return; }\nfunction setSyncState(state){',s,count=1,flags=re.S)
          s=s.replace('const APP_STATE_ROW_ID="main";\n','',1)
          p.write_text(s,encoding='utf-8',newline='')

          b=Path('v46-bridge.js')
          js=b.read_text(encoding='utf-8')
          js=js.replace('p_verifier_role:currentUser?.roleLabel||"Usuário"','p_verifier_role:currentUser?.role==="monitor"?"Monitor":"Professor"')
          if 'V46_DYNAMIC_DATE_RESET' not in js:
              js += '\n// V46_DYNAMIC_DATE_RESET\nresetRequestForm=function(){const day=recifeDateKey();$("#requestForm").reset();$("#date").value=day;$("#date").min=day;$("#studentPin").value="";formState={start:"07:30",end:"08:20"};selectedSavedStudentId="";populateSavedStudentSelect("");setGroupPickerValue("studentGroup","1°A DS");updateRequestSummary();};\nsetInterval(()=>{const nextDay=recifeDateKey();if(nextDay!==today){today=nextDay;render();}},30000);\n'
          b.write_text(js,encoding='utf-8',newline='')
          PY
      - name: Validate
        run: |
          node --check v46-bridge.js
          grep -q 'let today=recifeDateKey()' index.html
          grep -q 'V46_DYNAMIC_DATE_RESET' v46-bridge.js
          grep -q 'p_verifier_role:currentUser?.role==="monitor"?"Monitor":"Professor"' v46-bridge.js
          ! grep -q 'localStorage.setItem' index.html
          ! grep -q 'localStorage.getItem' index.html
          ! grep -q 'app_state' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v46-bridge.js
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize V46 visual runtime'
          git push
