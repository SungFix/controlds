name: Prime quality gate

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "*.webmanifest"
      - "favicon.svg"
      - "_headers"
      - ".github/workflows/prime-quality-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "*.webmanifest"
      - "favicon.svg"
      - "_headers"
      - ".github/workflows/prime-quality-gate.yml"

permissions:
  contents: read

concurrency:
  group: prime-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static structure, assets and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json, re, sys

          root=Path('.')
          html=(root/'index.html').read_text(encoding='utf-8')
          config=(root/'config.js').read_text(encoding='utf-8')
          errors=[]

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.ids=[]; self.labels=[]; self.assets=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if a.get('id'): self.ids.append(a['id'])
                  if tag=='label' and a.get('for'): self.labels.append(a['for'])
                  if tag=='script' and a.get('src'): self.assets.append(a['src'])
                  if tag=='link' and a.get('href'): self.assets.append(a['href'])

          p=Parser(); p.feed(html)
          duplicate=sorted({x for x in p.ids if p.ids.count(x)>1})
          if duplicate: errors.append('IDs duplicados: '+', '.join(duplicate))
          ids=set(p.ids)
          missing_labels=sorted({x for x in p.labels if x not in ids})
          if missing_labels: errors.append('Labels sem alvo: '+', '.join(missing_labels))

          refs=p.assets + re.findall(r'(?:ensureStylesheet|ensureScript)\([^,]+,\s*["\']([^"\']+)',config)
          for asset in refs:
              if asset.startswith(('http://','https://','//','data:','#')): continue
              path=asset.split('?',1)[0].split('#',1)[0]
              if path and not (root/path).exists(): errors.append('Asset local ausente: '+path)

          for rid in ['loginGate','loginForm','loginUsername','loginPassword','loginSubmit','studentRows','requestRows','permissionRows','historyRows']:
              if rid not in ids: errors.append('Elemento crítico ausente: '+rid)

          for css in root.glob('*.css'):
              clean=re.sub(r'/\*.*?\*/','',css.read_text(encoding='utf-8'),flags=re.S)
              if clean.count('{') != clean.count('}'): errors.append('CSS desbalanceado: '+css.name)

          try:
              manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
              for key in ['name','short_name','start_url','display','icons']:
                  if not manifest.get(key): errors.append('Manifest sem '+key)
          except Exception as exc:
              errors.append('Manifest inválido: '+str(exc))

          joined='\n'.join([html,config]+[f.read_text(encoding='utf-8') for f in root.glob('*.js')])
          for pattern in [r'SUPABASE_SERVICE_ROLE_KEY',r'DATABASE_PASSWORD',r'jwt[_-]?secret',r'postgres(?:ql)?://[^\s"\']+:[^\s"\']+@']:
              if re.search(pattern,joined,re.I): errors.append('Possível segredo privado no frontend: '+pattern)

          if errors:
              print('\n'.join('FAIL: '+x for x in errors)); sys.exit(1)
          print('STATIC PRIME AUDIT: PASS')
          PY

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in ./*.js; do [ -e "$file" ] && node --check "$file"; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          for i,b in enumerate(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',h,flags=re.I|re.S)):
              Path(f'/tmp/control-inline-{i}.js').write_text(b,encoding='utf-8')
          PY
          for file in /tmp/control-inline-*.js; do [ -e "$file" ] && node --check "$file"; done
          echo 'JAVASCRIPT PRIME AUDIT: PASS'

      - name: Install browser and accessibility tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 axe-core@4.10.3 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Browser, responsive, theme and accessibility audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/control-ds-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > prime-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import path from 'path';

          const axeSource=fs.readFileSync(path.resolve('node_modules/axe-core/axe.min.js'),'utf8');
          const browser=await chromium.launch({headless:true});

          async function noOverflow(page,label){
            const {sw,cw}=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            if(sw>cw+2) throw new Error(`${label}: overflow horizontal ${sw}/${cw}`);
          }

          async function auditA11y(page,label){
            await page.addScriptTag({content:axeSource});
            const result=await page.evaluate(async()=>await axe.run(document,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa']}}));
            const bad=result.violations.filter(v=>['critical','serious'].includes(v.impact));
            if(bad.length) throw new Error(`${label}: ${bad.map(v=>`${v.id} (${v.nodes.length})`).join(', ')}`);
          }

          for(const vp of [
            {width:1920,height:1080,label:'desktop-1920'},
            {width:1366,height:768,label:'notebook-1366'},
            {width:390,height:844,label:'mobile-390'}
          ]){
            const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            const response=await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:30000});
            if(!response?.ok()) throw new Error(`${vp.label}: HTTP ${response?.status()}`);
            await page.locator('#loginGate').waitFor({state:'visible'});
            await noOverflow(page,`${vp.label}-login`);
            if(!(await page.locator('#loginSubmit').isVisible())) throw new Error(`${vp.label}: Entrar invisível`);
            if(!(await page.locator('link[rel="manifest"]').count())) throw new Error(`${vp.label}: manifest não injetado`);
            if(!(await page.locator('.prime-skip-link').count())) throw new Error(`${vp.label}: skip link ausente`);
            if(!(await page.locator('.prime-network-banner').count())) throw new Error(`${vp.label}: banner de rede ausente`);

            const before=await page.evaluate(()=>document.documentElement.dataset.theme);
            const themeButton=page.locator('.control-theme-toggle:visible').first();
            await themeButton.click();
            const after=await page.evaluate(()=>document.documentElement.dataset.theme);
            if(before===after) throw new Error(`${vp.label}: tema não alternou`);
            await themeButton.click();

            if(vp.width===390){
              const card=await page.locator('.login-card').boundingBox();
              if(!card||card.x<-.5||card.x+card.width>390.5) throw new Error('mobile: login fora da tela');
            }

            await page.evaluate(()=>{
              v46AuthUser={id:'prime-audit-adm'};
              currentUser={username:'audit',displayName:'Auditor',role:'adm',roleLabel:'Administrador',userId:'prime-audit-adm'};
              appReady=true;data=[];students=[];permissions=[];history=[];
              setAuthLocked(false);setCurrentUser(currentUser);render();
            });

            for(const section of ['home','agenda','permissions','requests','students','computers','history']){
              await page.click(`[data-page="${section}"]`);
              await page.waitForTimeout(30);
              const active=await page.locator(`#page-${section}`).evaluate(el=>el.classList.contains('active'));
              if(!active) throw new Error(`${vp.label}: ${section} não ativou`);
              await noOverflow(page,`${vp.label}-${section}`);
            }

            await page.click('[data-page="home"]');
            await auditA11y(page,`${vp.label}-home`);
            if(pageErrors.length) throw new Error(`${vp.label}: erros JS: ${pageErrors.join(' | ')}`);
            await page.close();
          }

          await browser.close();
          console.log('PRIME BROWSER/A11Y AUDIT: PASS');
          JS
          node prime-audit.mjs
          rm -f prime-audit.mjs
