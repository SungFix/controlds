name: Contrast diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 axe-core@4.10.3 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Diagnose contrast
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/control-ds-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node .github/scripts/mobile-contrast-diagnostic.mjs
