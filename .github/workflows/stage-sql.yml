name: Stage V46 SQL
on:
  push:
    branches: [v46-stage-chatgpt]
permissions:
  contents: write
jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write SQL
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > supabase-schema-v46.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase-schema-v46.sql
          git commit -m 'Stage exact V46 SQL' || exit 0
          git push
