name: Add ETE favicon link

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-ete-favicon.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add favicon to index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          needle = '<title>Control Ds</title>'
          links = '<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">\n<link rel="shortcut icon" href="favicon.svg?v=1">'
          if 'href="favicon.svg?v=1"' not in s:
              assert needle in s
              s = s.replace(needle, needle + '\n' + links, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'rel="icon" type="image/svg+xml" href="favicon.svg?v=1"' index.html
          test -f favicon.svg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use ETE icon as site favicon"
          git push origin HEAD:main
