name: Stage exact V46 index
on:
  push:
    branches: [v46-stage-chatgpt]
permissions:
  contents: write
jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write exact V46 index
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > index.html
          test "$(git hash-object index.html)" = "36d51d64af875f86f359908884ae4161baca12c4"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Stage exact V46 index" || exit 0
          git push
