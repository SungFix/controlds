name: Browser smoke audit

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/*.js"
      - "**/*.css"
      - ".github/workflows/browser-smoke-audit.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run browser tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/control-ds-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > control-ds-smoke.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1366,height:768}});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));

          const res=await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:30000});
          if(!res?.ok())throw new Error(`local: HTTP ${res?.status()}`);
          await page.locator('#loginGate').waitFor({state:'visible'});
          if(errors.length)throw new Error(`local page errors: ${errors.join(' | ')}`);

          await page.evaluate(()=>window.ControlTheme?.set?.('dark'));
          await page.waitForTimeout(30);
          const dark=await page.evaluate(()=>({
            theme:document.documentElement.dataset.theme,
            bg:getComputedStyle(document.body).backgroundColor
          }));
          if(dark.theme!=='dark')throw new Error('local: tema escuro não aplicou');

          await page.evaluate(()=>window.ControlTheme?.set?.('light'));
          await page.waitForFunction(()=>document.documentElement.dataset.theme==='light',null,{timeout:3000});
          await page.waitForTimeout(30);

          const light=await page.evaluate(()=>{
            const root=getComputedStyle(document.documentElement);
            const body=getComputedStyle(document.body);
            const sample=document.querySelector('.login-card')||document.body;
            const sampleStyle=getComputedStyle(sample);
            return {
              theme:document.documentElement.dataset.theme,
              bg:root.getPropertyValue('--ui-bg').trim(),
              text:root.getPropertyValue('--ui-text').trim(),
              border:root.getPropertyValue('--ui-border').trim(),
              bodyTransition:body.transitionDuration,
              sampleTransition:sampleStyle.transitionDuration,
              paletteHref:document.getElementById('controlLightPaletteSageStyles')?.getAttribute('href')||'',
              fixedHref:document.getElementById('eteLightFixedPaletteStyles')?.getAttribute('href')||''
            };
          });

          if(light.theme!=='light')throw new Error('local: tema claro não aplicou');
          if(light.bg!=='#dfe7ea'||light.text!=='#425863'||light.border!=='#b4c5cc'){
            throw new Error(`local: tema não voltou à paleta anterior ${JSON.stringify(light)}`);
          }
          if(light.bodyTransition!=='0s'||light.sampleTransition!=='0s'){
            throw new Error(`local: troca de tema ainda possui transição visual ${JSON.stringify(light)}`);
          }

          await page.evaluate(()=>window.ControlTheme?.set?.('dark'));
          await page.waitForTimeout(30);
          const darkAfter=await page.evaluate(()=>({
            theme:document.documentElement.dataset.theme,
            bg:getComputedStyle(document.body).backgroundColor
          }));
          if(darkAfter.theme!=='dark'||darkAfter.bg!==dark.bg)throw new Error('local: retorno ao tema escuro falhou');

          await page.fill('#loginUsername','usuario_inexistente_teste');
          await page.fill('#loginPassword','senha_invalida_teste');
          await page.click('#loginSubmit');
          await page.waitForTimeout(1800);
          if(!(await page.locator('#loginError').isVisible()))throw new Error('local: login inválido não exibiu erro');

          await page.setViewportSize({width:390,height:844});
          await page.reload({waitUntil:'networkidle'});
          await page.locator('#loginGate').waitFor({state:'visible'});
          if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2)){
            throw new Error('local: overflow horizontal mobile');
          }
          const box=await page.locator('.login-card').boundingBox();
          if(!box||box.x<0||box.x+box.width>390.5)throw new Error('local: card fora da tela mobile');

          console.log('pre-warm light palette PASS');
          console.log('instant theme switch PASS');
          console.log('desktop/mobile PASS');
          await browser.close();
          JS
          node control-ds-smoke.mjs
