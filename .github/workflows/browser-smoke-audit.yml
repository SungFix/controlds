name: Browser smoke audit

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/*.js"
      - "**/*.css"
      - ".github/workflows/browser-smoke-audit.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run browser tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/control-ds-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > control-ds-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const results=[];

          const SAND={
            s0:'rgb(255, 250, 242)',
            s1:'rgb(248, 239, 226)',
            s2:'rgb(240, 226, 208)',
            s3:'rgb(229, 210, 186)',
            s4:'rgb(213, 191, 165)',
            s5:'rgb(185, 154, 122)',
            s6:'rgb(146, 115, 86)',
            s7:'rgb(110, 84, 63)',
            s8:'rgb(75, 57, 43)'
          };
          const allowed=new Set(Object.values(SAND));

          async function themeSnapshot(page){
            return page.evaluate(()=>{
              const root=document.documentElement;
              const bodyStyle=getComputedStyle(document.body);
              const loginCard=document.querySelector('.login-card');
              const cardStyle=loginCard?getComputedStyle(loginCard):null;
              const toggle=document.querySelector('.control-theme-toggle-floating');
              const toggleStyle=toggle?getComputedStyle(toggle):null;
              const rootStyle=getComputedStyle(root);
              return {
                theme:root.dataset.theme||'',
                stored:localStorage.getItem('control-ds-theme'),
                bodyOpacity:Number.parseFloat(bodyStyle.opacity),
                bodyFilter:bodyStyle.filter,
                bodyBackgroundColor:bodyStyle.backgroundColor,
                cardBackgroundColor:cardStyle?.backgroundColor||'',
                cardColor:cardStyle?.color||'',
                cardTransitionProperty:cardStyle?.transitionProperty||'',
                cardTransitionDuration:cardStyle?.transitionDuration||'',
                toggleAnimationName:toggleStyle?.animationName||'',
                toggleTransitionProperty:toggleStyle?.transitionProperty||'',
                uiBg:rootStyle.getPropertyValue('--ui-bg').trim(),
                uiSurface2:rootStyle.getPropertyValue('--ui-surface-2').trim(),
                uiText:rootStyle.getPropertyValue('--ui-text').trim(),
                uiBorder:rootStyle.getPropertyValue('--ui-border').trim(),
                legacyBg:rootStyle.getPropertyValue('--bg').trim(),
                legacyText:rootStyle.getPropertyValue('--text').trim(),
                themeColor:document.querySelector('meta[name="theme-color"]')?.content||''
              };
            });
          }

          async function installThemeAuditFixture(page){
            await page.evaluate(()=>{
              document.getElementById('themeAuditFixture')?.remove();
              const host=document.createElement('div');
              host.id='themeAuditFixture';
              host.style.cssText='position:fixed;left:-10000px;top:0;width:1200px;height:900px;pointer-events:none;';
              host.innerHTML=`
                <div class="shell"><aside class="sidebar"><div class="brandmark"></div><span class="local-pill">Supabase</span></aside><main class="main"><div class="topbar"><span class="page-symbol"></span><span class="sync">Sincronizado</span></div><div class="content"><button class="btn primary">Novo pedido</button><div class="quick-card"><div class="left"><strong>Ação</strong><small>Teste</small></div></div></div></main></div>
                <section id="eteCentralPortal" class="ete-portal"><div class="ete-system-card available"><span class="ete-system-icon"></span><span class="ete-system-status">Disponível</span></div><div class="ete-system-card available"><span class="ete-system-icon"></span><span class="ete-system-status">Disponível</span></div><div class="at-control-shell"><aside class="at-control-sidebar"><span class="at-control-brandmark">ETE</span><span class="at-control-side-dot"></span></aside><main class="at-app-main"><header class="at-app-topbar"><button class="at-app-theme">Tema</button><span class="at-app-sync"><i></i>Sincronizado</span></header><div class="at-app-content"><button class="at-btn primary">Novo registro</button><article class="at-metric"><div><strong>0</strong></div></article><div class="at-inline-search"><input class="at-input"></div></div></main></div></section>`;
              document.body.appendChild(host);
            });
          }

          async function assertSandOnly(page,label){
            await installThemeAuditFixture(page);
            const sample=await page.evaluate(()=>{
              const one=(selector,pseudo='')=>{
                const el=document.querySelector(selector);
                if(!el)return null;
                const s=getComputedStyle(el,pseudo||null);
                return {backgroundColor:s.backgroundColor,color:s.color,borderColor:s.borderColor};
              };
              return {
                body:one('body'),
                main:one('#themeAuditFixture .main'),
                sidebar:one('#themeAuditFixture .sidebar'),
                pageSymbol:one('#themeAuditFixture .page-symbol'),
                sync:one('#themeAuditFixture .sync'),
                syncDot:one('#themeAuditFixture .sync','::before'),
                quickCard:one('#themeAuditFixture .quick-card'),
                primary:one('#themeAuditFixture .btn.primary'),
                portal:one('#themeAuditFixture #eteCentralPortal.ete-portal'),
                portalCard1:one('#themeAuditFixture .ete-system-card:nth-child(1)'),
                portalCard2:one('#themeAuditFixture .ete-system-card:nth-child(2)'),
                portalStatus:one('#themeAuditFixture .ete-system-status'),
                portalDot:one('#themeAuditFixture .ete-system-status','::before'),
                atSidebar:one('#themeAuditFixture .at-control-sidebar'),
                atBrand:one('#themeAuditFixture .at-control-brandmark'),
                atSideDot:one('#themeAuditFixture .at-control-side-dot'),
                atTopbar:one('#themeAuditFixture .at-app-topbar'),
                atSync:one('#themeAuditFixture .at-app-sync'),
                atSyncDot:one('#themeAuditFixture .at-app-sync i'),
                atPrimary:one('#themeAuditFixture .at-btn.primary'),
                atMetric:one('#themeAuditFixture .at-metric'),
                atMetricDot:one('#themeAuditFixture .at-metric','::after'),
                atSearch:one('#themeAuditFixture .at-input')
              };
            });

            const backgroundKeys=['body','main','sidebar','pageSymbol','sync','syncDot','quickCard','primary','portalCard1','portalCard2','portalStatus','portalDot','atSidebar','atBrand','atSideDot','atTopbar','atSync','atSyncDot','atPrimary','atMetric','atMetricDot','atSearch'];
            for(const key of backgroundKeys){
              const value=sample[key]?.backgroundColor;
              if(!value) throw new Error(`${label}: seletor de auditoria ausente: ${key}`);
              if(value!=='rgba(0, 0, 0, 0)'&&!allowed.has(value)) throw new Error(`${label}: ${key} ainda usa cor fora da família areia: ${value}`);
            }
            if(sample.portal.backgroundColor!=='rgba(0, 0, 0, 0)'&&!allowed.has(sample.portal.backgroundColor)) throw new Error(`${label}: Portal ainda usa fundo fora da família areia: ${sample.portal.backgroundColor}`);
            results.push(`${label} sand-only computed colors PASS`);
          }

          async function testThemeSwitch(page,label){
            const toggle=page.locator('.control-theme-toggle-floating').first();
            await toggle.waitFor({state:'visible',timeout:5000});
            await page.evaluate(()=>window.ControlTheme?.set?.('dark'));
            await page.waitForTimeout(40);
            const before=await themeSnapshot(page);
            const darkFingerprint={
              bodyBackgroundColor:before.bodyBackgroundColor,
              cardBackgroundColor:before.cardBackgroundColor,
              cardColor:before.cardColor
            };

            await toggle.click();
            await page.waitForTimeout(60);
            const light=await themeSnapshot(page);
            if(light.theme!=='light') throw new Error(`${label}: tema claro não foi aplicado imediatamente`);
            if(light.cardTransitionProperty!=='none') throw new Error(`${label}: ainda existe transição visual no card (${light.cardTransitionProperty})`);
            if(light.toggleAnimationName!=='none') throw new Error(`${label}: botão de tema ainda possui animação (${light.toggleAnimationName})`);
            if(light.toggleTransitionProperty!=='none') throw new Error(`${label}: botão de tema ainda possui transição (${light.toggleTransitionProperty})`);
            if(Math.abs(light.bodyOpacity-1)>.01||light.bodyFilter!=='none') throw new Error(`${label}: troca de tema alterou opacidade ou filtro`);

            const expected={
              uiBg:'#f8efe2',
              uiSurface2:'#fffaf2',
              uiText:'#4b392b',
              uiBorder:'#d5bfa5',
              legacyBg:'#f8efe2',
              legacyText:'#4b392b'
            };
            for(const [key,value] of Object.entries(expected)){
              if(light[key].toLowerCase()!==value) throw new Error(`${label}: paleta areia incorreta em ${key}: ${light[key]}`);
            }
            if(light.themeColor.toLowerCase()!=='#f8efe2') throw new Error(`${label}: theme-color não está em areia: ${light.themeColor}`);

            await assertSandOnly(page,label);

            await toggle.click();
            await page.waitForTimeout(20);
            const after=await themeSnapshot(page);
            if(after.theme!=='dark') throw new Error(`${label}: tema escuro não voltou imediatamente`);
            for(const [key,value] of Object.entries(darkFingerprint)){
              if(after[key]!==value) throw new Error(`${label}: tema escuro mudou em ${key}`);
            }
            results.push(`${label} instant theme PASS`);
          }

          async function run(url,label,invalidLogin=false){
            const page=await browser.newPage({viewport:{width:1366,height:768}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            const res=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
            if(!res?.ok()) throw new Error(`${label}: HTTP ${res?.status()}`);
            await page.locator('#loginGate').waitFor({state:'visible'});
            const checks={
              username:await page.locator('#loginUsername').getAttribute('placeholder'),
              password:await page.locator('#loginPassword').getAttribute('placeholder'),
              button:await page.locator('#loginSubmit').isVisible(),
              title:await page.title(),
              overflow:await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2),
              favicon:await page.locator('link[rel="icon"]').getAttribute('href')
            };
            if(checks.username!=='Nome de usuário') throw new Error(`${label}: placeholder de usuário incorreto`);
            if(checks.password!=='Digite sua senha') throw new Error(`${label}: placeholder de senha incorreto`);
            if(!checks.button) throw new Error(`${label}: botão Entrar não visível`);
            if(checks.title!=='Control Ds') throw new Error(`${label}: título inesperado ${checks.title}`);
            if(checks.overflow) throw new Error(`${label}: overflow horizontal desktop`);
            if(!checks.favicon?.includes('favicon.svg')) throw new Error(`${label}: favicon não configurado`);
            if(pageErrors.length) throw new Error(`${label}: page errors ${pageErrors.join(' | ')}`);
            if(label==='local') await testThemeSwitch(page,label);
            if(invalidLogin){
              await page.fill('#loginUsername','usuario_inexistente_teste');
              await page.fill('#loginPassword','senha_invalida_teste');
              await page.click('#loginSubmit');
              await page.waitForTimeout(1800);
              if(!(await page.locator('#loginError').isVisible())) throw new Error(`${label}: login inválido não exibiu erro`);
            }
            results.push(`${label} desktop PASS`);
            await page.setViewportSize({width:390,height:844});
            await page.reload({waitUntil:'networkidle'});
            await page.locator('#loginGate').waitFor({state:'visible'});
            if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2)) throw new Error(`${label}: overflow horizontal mobile`);
            const card=page.locator('.login-card');
            const box=await card.boundingBox();
            if(!box || box.x<0 || box.x+box.width>390.5) throw new Error(`${label}: card fora da tela mobile`);
            results.push(`${label} mobile PASS`);
            await page.close();
          }

          await run('http://127.0.0.1:4173/','local',true);
          for(const [url,label] of [
            ['https://ete-controle-notebooks.pages.dev/','cloudflare'],
            ['https://sungfix.github.io/ete-controle-notebooks/','github-pages']
          ]){
            try{await run(url,label,false)}catch(e){results.push(`${label} WARN: ${e.message}`)}
          }
          console.log('=== BROWSER RESULTS ===');
          results.forEach(x=>console.log(x));
          await browser.close();
          JS
          node control-ds-smoke.mjs