name: Browser smoke audit

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/*.js"
      - "**/*.css"
      - ".github/workflows/browser-smoke-audit.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run browser tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/control-ds-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > control-ds-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const results=[];

          async function themeSnapshot(page){
            return page.evaluate(()=>{
              const overlay=document.getElementById('eteThemeTransitionOverlay');
              const overlayStyle=overlay?getComputedStyle(overlay):null;
              const bodyStyle=getComputedStyle(document.body);
              return {
                theme:document.documentElement.dataset.theme||'',
                exists:!!overlay,
                overlayOpacity:overlayStyle?Number.parseFloat(overlayStyle.opacity):0,
                overlayBackground:overlayStyle?.backgroundColor||'',
                overlayState:overlay?.dataset?.themeTransition||'',
                running:document.documentElement.classList.contains('ete-theme-transition-running'),
                bodyOpacity:Number.parseFloat(bodyStyle.opacity),
                bodyFilter:bodyStyle.filter
              };
            });
          }

          async function testThemeTransition(page,label){
            const toggle=page.locator('.control-theme-toggle-floating').first();
            await toggle.waitFor({state:'visible',timeout:5000});
            const before=await themeSnapshot(page);
            if(!before.exists) throw new Error(`${label}: véu de transição não foi montado`);

            await toggle.click();
            await page.waitForTimeout(120);
            const early=await themeSnapshot(page);
            if(!(early.overlayOpacity>.05&&early.overlayOpacity<.98)) throw new Error(`${label}: transição não ficou visível no início (${early.overlayOpacity})`);
            if(early.theme!==before.theme) throw new Error(`${label}: tema mudou antes do meio da transição`);
            if(!early.running||early.overlayState!=='covering') throw new Error(`${label}: fase inicial da transição incorreta`);
            if(Math.abs(early.bodyOpacity-1)>.01) throw new Error(`${label}: conteúdo teve opacidade alterada durante a transição`);
            if(early.bodyFilter!=='none') throw new Error(`${label}: conteúdo recebeu filtro de luminosidade`);

            await page.waitForTimeout(190);
            const middle=await themeSnapshot(page);
            if(middle.theme===before.theme) throw new Error(`${label}: tema não mudou no meio da transição`);
            if(!(middle.overlayOpacity>.05)) throw new Error(`${label}: véu sumiu cedo demais`);
            if(!middle.running||middle.overlayState!=='revealing') throw new Error(`${label}: fase final da transição incorreta`);
            if(Math.abs(middle.bodyOpacity-1)>.01||middle.bodyFilter!=='none') throw new Error(`${label}: conteúdo foi clareado/escurecido artificialmente`);
            const neutralBackground=middle.overlayBackground;

            await page.waitForTimeout(330);
            const end=await themeSnapshot(page);
            if(end.theme===before.theme) throw new Error(`${label}: troca de tema não concluiu`);
            if(end.overlayOpacity>.02||end.overlayState!=='idle'||end.running) throw new Error(`${label}: transição não terminou limpa`);

            await toggle.click();
            await page.waitForTimeout(120);
            const reverseEarly=await themeSnapshot(page);
            if(reverseEarly.theme!==end.theme) throw new Error(`${label}: retorno mudou o tema antes do meio`);
            if(!(reverseEarly.overlayOpacity>.05&&reverseEarly.overlayOpacity<.98)) throw new Error(`${label}: retorno não mostrou transição`);
            if(reverseEarly.overlayBackground!==neutralBackground) throw new Error(`${label}: transição usa tonalidades diferentes entre os sentidos`);
            if(Math.abs(reverseEarly.bodyOpacity-1)>.01||reverseEarly.bodyFilter!=='none') throw new Error(`${label}: retorno alterou brilho/opacidade do conteúdo`);

            await page.waitForTimeout(520);
            const reverseEnd=await themeSnapshot(page);
            if(reverseEnd.theme!==before.theme) throw new Error(`${label}: retorno não restaurou o tema inicial`);
            if(reverseEnd.overlayOpacity>.02||reverseEnd.overlayState!=='idle'||reverseEnd.running) throw new Error(`${label}: retorno não terminou limpo`);
            results.push(`${label} theme transition PASS`);
          }

          async function run(url,label,invalidLogin=false){
            const page=await browser.newPage({viewport:{width:1366,height:768}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            const res=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
            if(!res?.ok()) throw new Error(`${label}: HTTP ${res?.status()}`);
            await page.locator('#loginGate').waitFor({state:'visible'});
            const checks={
              username:await page.locator('#loginUsername').getAttribute('placeholder'),
              password:await page.locator('#loginPassword').getAttribute('placeholder'),
              button:await page.locator('#loginSubmit').isVisible(),
              title:await page.title(),
              overflow:await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2),
              favicon:await page.locator('link[rel="icon"]').getAttribute('href')
            };
            if(checks.username!=='Nome de usuário') throw new Error(`${label}: placeholder de usuário incorreto`);
            if(checks.password!=='Digite sua senha') throw new Error(`${label}: placeholder de senha incorreto`);
            if(!checks.button) throw new Error(`${label}: botão Entrar não visível`);
            if(checks.title!=='Control Ds') throw new Error(`${label}: título inesperado ${checks.title}`);
            if(checks.overflow) throw new Error(`${label}: overflow horizontal desktop`);
            if(!checks.favicon?.includes('favicon.svg')) throw new Error(`${label}: favicon não configurado`);
            if(pageErrors.length) throw new Error(`${label}: page errors ${pageErrors.join(' | ')}`);
            if(label==='local') await testThemeTransition(page,label);
            if(invalidLogin){
              await page.fill('#loginUsername','usuario_inexistente_teste');
              await page.fill('#loginPassword','senha_invalida_teste');
              await page.click('#loginSubmit');
              await page.waitForTimeout(1800);
              if(!(await page.locator('#loginError').isVisible())) throw new Error(`${label}: login inválido não exibiu erro`);
            }
            results.push(`${label} desktop PASS`);
            await page.setViewportSize({width:390,height:844});
            await page.reload({waitUntil:'networkidle'});
            await page.locator('#loginGate').waitFor({state:'visible'});
            if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2)) throw new Error(`${label}: overflow horizontal mobile`);
            const card=page.locator('.login-card');
            const box=await card.boundingBox();
            if(!box || box.x<0 || box.x+box.width>390.5) throw new Error(`${label}: card fora da tela mobile`);
            results.push(`${label} mobile PASS`);
            await page.close();
          }
          await run('http://127.0.0.1:4173/','local',true);
          for(const [url,label] of [
            ['https://ete-controle-notebooks.pages.dev/','cloudflare'],
            ['https://sungfix.github.io/ete-controle-notebooks/','github-pages']
          ]){
            try{await run(url,label,false)}catch(e){results.push(`${label} WARN: ${e.message}`)}
          }
          console.log('=== BROWSER RESULTS ===');
          results.forEach(x=>console.log(x));
          await browser.close();
          JS
          node control-ds-smoke.mjs

# Reexecutado após as correções finais de 2026-08-28.
