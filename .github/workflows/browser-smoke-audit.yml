name: Browser smoke audit

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/*.js"
      - "**/*.css"
      - ".github/workflows/browser-smoke-audit.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run browser tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/control-ds-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > control-ds-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const results=[];

          async function themeSnapshot(page){
            return page.evaluate(()=>{
              const root=document.documentElement;
              const bodyStyle=getComputedStyle(document.body);
              const loginCard=document.querySelector('.login-card');
              const cardStyle=loginCard?getComputedStyle(loginCard):null;
              const rootStyle=getComputedStyle(root);
              const toggle=document.querySelector('.control-theme-toggle-floating');
              return {
                theme:root.dataset.theme||'',
                stored:localStorage.getItem('control-ds-theme'),
                controlThemeGet:window.ControlTheme?.get?.()||'',
                transitioning:root.classList.contains('theme-transitioning'),
                guaranteed:root.classList.contains('ete-theme-guaranteed'),
                toggleAnimating:!!toggle?.classList.contains('theme-toggle-animating'),
                overlayExists:!!document.getElementById('eteThemeTransitionOverlay'),
                bodyOpacity:Number.parseFloat(bodyStyle.opacity),
                bodyFilter:bodyStyle.filter,
                bodyBackgroundColor:bodyStyle.backgroundColor,
                cardBackgroundColor:cardStyle?.backgroundColor||'',
                cardColor:cardStyle?.color||'',
                cardTransitionDuration:cardStyle?.transitionDuration||'',
                uiBg:rootStyle.getPropertyValue('--ui-bg').trim(),
                uiSurface2:rootStyle.getPropertyValue('--ui-surface-2').trim(),
                uiText:rootStyle.getPropertyValue('--ui-text').trim(),
                uiBorder:rootStyle.getPropertyValue('--ui-border').trim(),
                legacyBg:rootStyle.getPropertyValue('--bg').trim(),
                legacyText:rootStyle.getPropertyValue('--text').trim(),
                themeColor:document.querySelector('meta[name="theme-color"]')?.content||'',
                colorSchemeMeta:document.querySelector('meta[name="color-scheme"]')?.content||''
              };
            });
          }

          async function installThemeTrace(page){
            await page.evaluate(()=>{
              window.__themeTrace=[];
              const root=document.documentElement;
              const push=(type,extra={})=>window.__themeTrace.push({
                type,
                t:Math.round(performance.now()),
                theme:root.dataset.theme||'',
                stored:localStorage.getItem('control-ds-theme'),
                transitioning:root.classList.contains('theme-transitioning'),
                guaranteed:root.classList.contains('ete-theme-guaranteed'),
                ...extra
              });
              new MutationObserver(records=>{
                for(const record of records){
                  if(record.attributeName==='data-theme')push('data-theme-mutation');
                }
              }).observe(root,{attributes:true,attributeFilter:['data-theme']});
              window.addEventListener('control-theme-change',event=>push('control-theme-change',{detail:event.detail?.theme||''}));
              window.addEventListener('click',event=>{
                if(event.target.closest?.('.control-theme-toggle'))push('theme-click-window-capture');
              },true);
              push('trace-installed');
            });
          }

          async function testThemeTransition(page,label){
            const toggle=page.locator('.control-theme-toggle-floating').first();
            await toggle.waitFor({state:'visible',timeout:5000});
            const before=await themeSnapshot(page);
            if(before.overlayExists) throw new Error(`${label}: sistema antigo de véu ainda está ativo`);
            const darkFingerprint={
              bodyBackgroundColor:before.bodyBackgroundColor,
              cardBackgroundColor:before.cardBackgroundColor,
              cardColor:before.cardColor,
              themeColor:before.themeColor
            };

            await installThemeTrace(page);
            const implementation=await page.evaluate(()=>({
              toggle:String(window.ControlTheme?.toggle||''),
              set:String(window.ControlTheme?.set||''),
              get:String(window.ControlTheme?.get||''),
              finalPolishText:document.getElementById('controlFinalPolishScript')?.src||'',
              scripts:[...document.scripts].map(script=>script.src).filter(Boolean)
            }));
            const directResult=await page.evaluate(()=>window.ControlTheme?.toggle?.());
            await page.waitForTimeout(70);
            const direct70=await themeSnapshot(page);
            await page.waitForTimeout(260);
            const direct330=await themeSnapshot(page);
            await page.waitForTimeout(300);
            const direct630=await themeSnapshot(page);
            const directTrace=await page.evaluate(()=>window.__themeTrace||[]);
            console.log('=== DIRECT THEME DIAGNOSTIC ===');
            console.log(JSON.stringify({before,implementation,directResult,direct70,direct330,direct630,directTrace},null,2));

            if(direct70.theme!=='light'){
              throw new Error(`${label}: chamada direta ControlTheme.toggle não aplicou tema claro imediatamente`);
            }

            await page.evaluate(()=>window.ControlTheme?.set?.('dark'));
            await page.waitForTimeout(620);
            await page.evaluate(()=>{window.__themeTrace=[];});

            await toggle.click();
            await page.waitForTimeout(70);
            const light=await themeSnapshot(page);
            const clickTrace=await page.evaluate(()=>window.__themeTrace||[]);
            console.log('=== CLICK THEME DIAGNOSTIC ===');
            console.log(JSON.stringify({light,clickTrace},null,2));
            if(light.theme===before.theme) throw new Error(`${label}: sistema Epoch não aplicou o novo tema imediatamente`);
            if(light.theme!=='light') throw new Error(`${label}: troca não chegou ao tema claro`);
            if(!light.transitioning) throw new Error(`${label}: classe de transição do Epoch não ficou ativa`);
            if(!light.toggleAnimating) throw new Error(`${label}: botão de tema não recebeu a animação do Epoch`);
            if(light.overlayExists) throw new Error(`${label}: véu antigo reapareceu`);
            if(Math.abs(light.bodyOpacity-1)>.01) throw new Error(`${label}: conteúdo teve opacidade alterada`);
            if(light.bodyFilter!=='none') throw new Error(`${label}: conteúdo recebeu filtro artificial`);
            if(!light.cardTransitionDuration.includes('0.43s')) throw new Error(`${label}: duração visual não corresponde aos 430ms do Epoch (${light.cardTransitionDuration})`);

            const expected={
              uiBg:'#f5efe6',
              uiSurface2:'#fffdf9',
              uiText:'#1b1916',
              uiBorder:'#d7cec1',
              legacyBg:'#f5efe6',
              legacyText:'#1b1916'
            };
            for(const [key,value] of Object.entries(expected)){
              if(light[key].toLowerCase()!==value) throw new Error(`${label}: paleta Epoch incorreta em ${key}: ${light[key]}`);
            }
            if(light.themeColor.toLowerCase()!=='#f5efe6') throw new Error(`${label}: theme-color claro não usa a paleta Epoch`);
            if(light.colorSchemeMeta!=='dark light') throw new Error(`${label}: meta color-scheme não foi sincronizada`);

            await page.waitForTimeout(500);
            const lightEnd=await themeSnapshot(page);
            if(lightEnd.transitioning||lightEnd.toggleAnimating) throw new Error(`${label}: transição clara não encerrou limpa`);

            await toggle.click();
            await page.waitForTimeout(70);
            const darkReturning=await themeSnapshot(page);
            if(darkReturning.theme!=='dark') throw new Error(`${label}: retorno não aplicou o tema escuro imediatamente`);
            if(!darkReturning.transitioning||!darkReturning.toggleAnimating) throw new Error(`${label}: retorno não usa a mesma transição`);
            if(Math.abs(darkReturning.bodyOpacity-1)>.01||darkReturning.bodyFilter!=='none') throw new Error(`${label}: retorno alterou opacidade/filtro`);

            await page.waitForTimeout(500);
            const after=await themeSnapshot(page);
            if(after.transitioning||after.toggleAnimating) throw new Error(`${label}: retorno não encerrou limpo`);
            if(after.theme!=='dark') throw new Error(`${label}: tema escuro não foi restaurado`);
            for(const [key,value] of Object.entries(darkFingerprint)){
              if(after[key]!==value) throw new Error(`${label}: tema escuro mudou em ${key}`);
            }
            results.push(`${label} Epoch theme + palette PASS`);
          }

          async function run(url,label,invalidLogin=false){
            const page=await browser.newPage({viewport:{width:1366,height:768}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            const res=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
            if(!res?.ok()) throw new Error(`${label}: HTTP ${res?.status()}`);
            await page.locator('#loginGate').waitFor({state:'visible'});
            const checks={
              username:await page.locator('#loginUsername').getAttribute('placeholder'),
              password:await page.locator('#loginPassword').getAttribute('placeholder'),
              button:await page.locator('#loginSubmit').isVisible(),
              title:await page.title(),
              overflow:await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2),
              favicon:await page.locator('link[rel="icon"]').getAttribute('href')
            };
            if(checks.username!=='Nome de usuário') throw new Error(`${label}: placeholder de usuário incorreto`);
            if(checks.password!=='Digite sua senha') throw new Error(`${label}: placeholder de senha incorreto`);
            if(!checks.button) throw new Error(`${label}: botão Entrar não visível`);
            if(checks.title!=='Control Ds') throw new Error(`${label}: título inesperado ${checks.title}`);
            if(checks.overflow) throw new Error(`${label}: overflow horizontal desktop`);
            if(!checks.favicon?.includes('favicon.svg')) throw new Error(`${label}: favicon não configurado`);
            if(pageErrors.length) throw new Error(`${label}: page errors ${pageErrors.join(' | ')}`);
            if(label==='local') await testThemeTransition(page,label);
            if(invalidLogin){
              await page.fill('#loginUsername','usuario_inexistente_teste');
              await page.fill('#loginPassword','senha_invalida_teste');
              await page.click('#loginSubmit');
              await page.waitForTimeout(1800);
              if(!(await page.locator('#loginError').isVisible())) throw new Error(`${label}: login inválido não exibiu erro`);
            }
            results.push(`${label} desktop PASS`);
            await page.setViewportSize({width:390,height:844});
            await page.reload({waitUntil:'networkidle'});
            await page.locator('#loginGate').waitFor({state:'visible'});
            if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2)) throw new Error(`${label}: overflow horizontal mobile`);
            const card=page.locator('.login-card');
            const box=await card.boundingBox();
            if(!box || box.x<0 || box.x+box.width>390.5) throw new Error(`${label}: card fora da tela mobile`);
            results.push(`${label} mobile PASS`);
            await page.close();
          }
          await run('http://127.0.0.1:4173/','local',true);
          for(const [url,label] of [
            ['https://ete-controle-notebooks.pages.dev/','cloudflare'],
            ['https://sungfix.github.io/ete-controle-notebooks/','github-pages']
          ]){
            try{await run(url,label,false)}catch(e){results.push(`${label} WARN: ${e.message}`)}
          }
          console.log('=== BROWSER RESULTS ===');
          results.forEach(x=>console.log(x));
          await browser.close();
          JS
          node control-ds-smoke.mjs

# Reexecutado após as correções finais de 2026-08-28.
