name: Update student edit and cascade UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-student-edit-cascade.yml"
      - ".github/patch-student-edit.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch bridge
        run: python .github/patch-student-edit.py
      - name: Validate bridge
        run: |
          node --check v46-bridge.js
          grep -q 'data-edit-student' v46-bridge.js
          grep -q 'ete_update_student' v46-bridge.js
          grep -q 'TODOS os dados ligados' v46-bridge.js
      - name: Commit bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v46-bridge.js
          git commit -m "Add student editing and full cascade removal"
          git push origin HEAD:main
