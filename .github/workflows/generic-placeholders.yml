name: Generic placeholders

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generic-placeholders.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace personal examples
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'placeholder="Ex.: klenio"':'placeholder="Nome de usuário"',
            'placeholder="Sua senha"':'placeholder="Digite sua senha"',
            'placeholder="Ex.: Luís Otávio"':'placeholder="Nome completo do aluno"',
            'placeholder="Ex.: João Silva"':'placeholder="Nome completo do responsável"',
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          ! grep -q 'Ex.: klenio' index.html
          ! grep -q 'Ex.: Luís Otávio' index.html
          ! grep -q 'Ex.: João Silva' index.html
          grep -q 'placeholder="Nome de usuário"' index.html
          grep -q 'placeholder="Nome completo do aluno"' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use generic form placeholders"
          git push origin HEAD:main
