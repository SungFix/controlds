name: Full site audit

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/*.js"
      - "**/*.css"
      - ".github/workflows/full-site-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static structure and security audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, sys

          root=Path('.')
          html=(root/'index.html').read_text(encoding='utf-8')
          bridge=(root/'v46-bridge.js').read_text(encoding='utf-8')
          config=(root/'config.js').read_text(encoding='utf-8')
          errors=[]

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.ids=[]; self.assets=[]; self.labels=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if a.get('id'): self.ids.append(a['id'])
                  if tag=='script' and a.get('src'): self.assets.append(a['src'])
                  if tag=='link' and a.get('href'): self.assets.append(a['href'])
                  if tag=='label' and a.get('for'): self.labels.append(a['for'])
          p=P(); p.feed(html)
          dup=sorted({x for x in p.ids if p.ids.count(x)>1})
          if dup: errors.append('IDs duplicados: '+', '.join(dup))
          ids=set(p.ids)
          missing=[x for x in p.labels if x not in ids]
          if missing: errors.append('Labels sem alvo: '+', '.join(sorted(set(missing))))
          for asset in p.assets:
              if asset.startswith(('http://','https://','//','data:','#')): continue
              path=asset.split('?',1)[0].split('#',1)[0]
              if path and not (root/path).exists(): errors.append('Asset ausente: '+path)
          placeholders=re.findall(r'placeholder=["\']([^"\']*)',html,re.I)
          for value in placeholders:
              if any(x in value.lower() for x in ['klenio','luís otávio','luis otavio','joão silva','joao silva']):
                  errors.append('Placeholder pessoal: '+value)
          text='\n'.join([html,bridge,config])
          for pat in [r'SUPABASE_SERVICE_ROLE_KEY',r'DATABASE_PASSWORD',r'jwt[_-]?secret',r'postgres(?:ql)?://[^\s"\']+:[^\s"\']+@']:
              if re.search(pat,text,re.I): errors.append('Possível segredo privado no frontend: '+pat)
          required=['loginGate','loginForm','loginUsername','loginPassword','loginSubmit','studentRows','requestRows','permissionRows','historyRows']
          for rid in required:
              if rid not in ids: errors.append('Elemento crítico ausente: '+rid)
          for css_name in ['login-simple-v2.css','ete-ui-v2.css']:
              css=(root/css_name).read_text(encoding='utf-8')
              if css.count('{')!=css.count('}'): errors.append('CSS desbalanceado: '+css_name)
          if 'persistSession:false' not in html.replace(' ','') and 'persistSession:false' not in bridge.replace(' ',''):
              errors.append('persistSession:false não confirmado')
          if errors:
              print('\n'.join('FAIL: '+x for x in errors)); sys.exit(1)
          print('STATIC AUDIT: PASS')
          PY

      - name: JavaScript syntax audit
        shell: bash
        run: |
          set -euo pipefail
          for f in ./*.js; do [ -e "$f" ] && node --check "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',h,flags=re.I|re.S)
          for i,b in enumerate(blocks): Path(f'inline-audit-{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in inline-audit-*.js; do [ -e "$f" ] && node --check "$f"; done
          rm -f inline-audit-*.js
          echo 'JAVASCRIPT SYNTAX: PASS'

      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Browser smoke audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/control-ds-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > full-browser-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          async function test(url,label){
            const page=await browser.newPage({viewport:{width:1366,height:768}});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            const r=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
            if(!r?.ok()) throw new Error(`${label}: HTTP ${r?.status()}`);
            await page.locator('#loginGate').waitFor({state:'visible'});
            if(await page.locator('#loginUsername').getAttribute('placeholder')!=='Nome de usuário') throw new Error(`${label}: usuário placeholder`);
            if(await page.locator('#loginPassword').getAttribute('placeholder')!=='Digite sua senha') throw new Error(`${label}: senha placeholder`);
            if(!(await page.locator('#loginSubmit').isVisible())) throw new Error(`${label}: botão Entrar`);
            if((await page.title())!=='Control Ds') throw new Error(`${label}: title`);
            if(errors.length) throw new Error(`${label}: JS ${errors.join(' | ')}`);
            if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2)) throw new Error(`${label}: overflow desktop`);
            await page.setViewportSize({width:390,height:844}); await page.reload({waitUntil:'networkidle'});
            await page.locator('#loginGate').waitFor({state:'visible'});
            if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2)) throw new Error(`${label}: overflow mobile`);
            const b=await page.locator('.login-card').boundingBox();
            if(!b || b.x<0 || b.x+b.width>390.5) throw new Error(`${label}: card mobile fora da tela`);
            await page.close(); console.log(`${label}: PASS`);
          }
          await test('http://127.0.0.1:4173/','local');
          await test('https://ete-controle-notebooks.pages.dev/','cloudflare');
          await browser.close();
          JS
          node full-browser-audit.mjs
          rm -f full-browser-audit.mjs

      - name: Repository hygiene audit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/generic-placeholders.yml
          test ! -e .github/workflows/bump-login-v6.yml
          test ! -e .github/workflows/add-student-delete.yml
          echo 'REPOSITORY HYGIENE: PASS'
