name: Authenticated UI interaction audit v2

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - ".github/scripts/ui-interaction-audit.mjs"
      - ".github/workflows/ui-interaction-audit-v2.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - ".github/scripts/ui-interaction-audit.mjs"
      - ".github/workflows/ui-interaction-audit-v2.yml"

permissions:
  contents: read

concurrency:
  group: ui-interaction-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript audit syntax
        run: node --check .github/scripts/ui-interaction-audit.mjs

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Test authenticated UI with mocked RPC transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/control-ds-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node .github/scripts/ui-interaction-audit.mjs
