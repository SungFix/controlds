name: Authenticated UI interaction audit v2

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - ".github/scripts/ui-interaction-audit.mjs"
      - ".github/scripts/atestados-register-audit.mjs"
      - ".github/scripts/atestados-image-upload-audit.mjs"
      - ".github/scripts/registered-student-flow-audit.mjs"
      - ".github/scripts/request-creator-audit.mjs"
      - ".github/workflows/ui-interaction-audit-v2.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - ".github/scripts/ui-interaction-audit.mjs"
      - ".github/scripts/atestados-register-audit.mjs"
      - ".github/scripts/atestados-image-upload-audit.mjs"
      - ".github/scripts/registered-student-flow-audit.mjs"
      - ".github/scripts/request-creator-audit.mjs"
      - ".github/workflows/ui-interaction-audit-v2.yml"

permissions:
  contents: read

concurrency:
  group: ui-interaction-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript audit syntax
        run: |
          node --check .github/scripts/ui-interaction-audit.mjs
          node --check .github/scripts/atestados-register-audit.mjs
          node --check .github/scripts/atestados-image-upload-audit.mjs
          node --check .github/scripts/registered-student-flow-audit.mjs
          node --check .github/scripts/request-creator-audit.mjs

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Test authenticated UI with mocked RPC transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/control-ds-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node .github/scripts/ui-interaction-audit.mjs
          node .github/scripts/atestados-register-audit.mjs
          node .github/scripts/atestados-image-upload-audit.mjs
          node .github/scripts/registered-student-flow-audit.mjs
          node .github/scripts/request-creator-audit.mjs

      - name: Upload request creator preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-creator-preview
          path: artifacts/request-creator-preview.png
          if-no-files-found: ignore
          retention-days: 7
