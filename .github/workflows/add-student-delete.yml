name: Add student removal UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-student-delete.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch V46 bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("v46-bridge.js")
          src = path.read_text(encoding="utf-8")
          if "data-delete-student" in src:
              raise SystemExit("student removal UI already present")

          error_anchor = '  if(m.includes("request_in_use")) return "Confirme a devolução antes de apagar o pedido.";\n'
          assert error_anchor in src
          src = src.replace(
              error_anchor,
              error_anchor + '  if(m.includes("student_not_found")) return "Aluno não encontrado. Atualize a página e tente novamente.";\n',
              1,
          )

          render_anchor = 'canDeleteRequest=function(r){if(!currentUser||!r)return false;return currentUser.role==="adm"||String(r.requestedById||"")===String(v46AuthUser?.id||"");};\n'
          assert render_anchor in src
          render_patch = '''const v46RenderStudentsBase=renderStudents;
          renderStudents=function(){
            v46RenderStudentsBase();
            if(!canManageStudents())return;
            const q=($("#studentSearch")?.value||"").toLocaleLowerCase("pt-BR");
            const list=[...students]
              .filter(s=>(s.name+" "+s.className+" "+s.course).toLocaleLowerCase("pt-BR").includes(q))
              .sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
            const cards=$$("#studentRows .student-card");
            cards.forEach((card,index)=>{
              const s=list[index],foot=card.querySelector(".student-card-foot");
              if(!s||!foot||foot.querySelector("[data-delete-student]"))return;
              let actions=foot.querySelector(".v46-student-actions");
              if(!actions){
                actions=document.createElement("div");
                actions.className="row-actions v46-student-actions";
                const useButton=foot.querySelector("[data-use-student]");
                if(useButton)actions.append(useButton);
                foot.append(actions);
              }
              const button=document.createElement("button");
              button.type="button";
              button.className="btn small danger";
              button.dataset.deleteStudent=s.id;
              button.textContent="Remover";
              button.title="Remover aluno da lista";
              actions.append(button);
            });
          };
          '''
          src = src.replace(render_anchor, render_anchor + render_patch, 1)

          click_anchor = 'delReq=target.closest?.("[data-delete-request]"),ret=target.closest?.("[data-return]")'
          assert click_anchor in src
          src = src.replace(
              click_anchor,
              'delStudent=target.closest?.("[data-delete-student]"),delReq=target.closest?.("[data-delete-request]"),ret=target.closest?.("[data-return]")',
              1,
          )

          guard_anchor = 'if(!(confirmExit||revoke||restorePerm||delReq||ret||exitRole))return;'
          assert guard_anchor in src
          src = src.replace(
              guard_anchor,
              'if(!(confirmExit||revoke||restorePerm||delStudent||delReq||ret||exitRole))return;',
              1,
          )

          branch_anchor = '}else if(delReq){const r=data.find'
          assert branch_anchor in src
          delete_branch = '''}else if(delStudent){
            if(!canManageStudents())throw new Error("forbidden");
            const s=students.find(x=>String(x.id)===String(delStudent.dataset.deleteStudent));
            if(!s)return;
            if(!confirm(`Remover ${s.name} da lista de alunos?\\n\\nPedidos e histórico antigos não serão apagados.`))return;
            await v46Rpc("ete_delete_student",{p_student_id:String(s.id)});
            toast("Aluno removido da lista.");
          }else if(delReq){const r=data.find'''
          src = src.replace(branch_anchor, delete_branch, 1)

          path.write_text(src, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          node --check v46-bridge.js
          grep -q 'data-delete-student' v46-bridge.js
          grep -q 'ete_delete_student' v46-bridge.js
          grep -q 'Pedidos e histórico antigos não serão apagados' v46-bridge.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v46-bridge.js
          git commit -m "Add student removal action"
          git push origin HEAD:main
